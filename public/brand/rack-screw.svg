<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" width="300" height="220">
  <defs>
    <linearGradient id="void" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#000000"/>
      <stop offset=".6"  stop-color="#0a0a0a"/>
      <stop offset="1"   stop-color="#1e1e1e"/>
    </linearGradient>
    <linearGradient id="cut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#000000" stop-opacity=".9"/>
      <stop offset=".55" stop-color="#1c1c1c" stop-opacity=".55"/>
      <stop offset=".86" stop-color="#8e8c87" stop-opacity=".45"/>
      <stop offset="1"   stop-color="#d8d6d0" stop-opacity=".6"/>
    </linearGradient>
    <radialGradient id="dome" cx="36%" cy="30%" r="92%">
      <stop offset="0"   stop-color="#62626b"/>
      <stop offset=".34" stop-color="#404047"/>
      <stop offset=".68" stop-color="#26262c"/>
      <stop offset=".85" stop-color="#171719"/>
      <stop offset="1"   stop-color="#0e0e11"/>
    </radialGradient>
    <radialGradient id="spec" cx="31%" cy="23%" r="26%">
      <stop offset="0"   stop-color="#ffffff" stop-opacity=".8"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".26"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="15%" y1="8%" x2="85%" y2="92%">
      <stop offset="0"   stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset=".38" stop-color="#ffffff" stop-opacity=".12"/>
      <stop offset=".62" stop-color="#000000" stop-opacity=".4"/>
      <stop offset="1"   stop-color="#000000" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="flute" x1="18%" y1="10%" x2="78%" y2="95%">
      <stop offset="0"   stop-color="#000000"/>
      <stop offset=".58" stop-color="#000000"/>
      <stop offset=".84" stop-color="#3a3a3e"/>
      <stop offset="1"   stop-color="#84848a"/>
    </linearGradient>
  </defs>

  <!-- obround cutout; the screw is seated at its left end, so one end stays visible -->
  <rect x="92" y="71" width="176" height="78" rx="39" fill="url(#void)"/>
  <rect x="92" y="71" width="176" height="78" rx="39" fill="none" stroke="url(#cut)" stroke-width="2.6"/>

  <circle cx="130" cy="113" r="88" fill="#000" opacity=".6"/>
  <circle cx="128" cy="110" r="88" fill="url(#dome)"/>
  <circle cx="128" cy="110" r="88" fill="url(#spec)"/>

  <!-- Phillips recess: tapered flutes, about half the head across -->
  <g transform="rotate(17 128 110)">
    <path fill="url(#flute)" d="
      M 140.6,97.4 L 175.0,101.9 L 175.0,118.1 L 140.6,122.6
      L 136.1,157   L 119.9,157   L 115.4,122.6
      L 81.0,118.1   L 81.0,101.9   L 115.4,97.4
      L 119.9,63    L 136.1,63    Z"/>
    <circle cx="128" cy="110" r="7.2" fill="#000"/>
  </g>
  <circle cx="128" cy="110" r="86.8" fill="none" stroke="url(#rim)" stroke-width="3.2"/>
</svg>
